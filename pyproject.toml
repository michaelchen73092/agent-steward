[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-steward"
version = "0.25.0"
description = "A quality gate and spend auditor for your AI agent fleet."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Wei-Chih Chen", email = "michaelchen73092@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]
keywords = ["ai-agents", "quality-gate", "llm", "verification", "cost-optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
steward = "agent_steward.cli:main"

[project.urls]
Homepage = "https://github.com/michaelchen73092/agent-steward"
Repository = "https://github.com/michaelchen73092/agent-steward"
Issues = "https://github.com/michaelchen73092/agent-steward/issues"
Changelog = "https://github.com/michaelchen73092/agent-steward/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_steward"]

[tool.ruff]
# The lint contract is pinned HERE, not inherited from whatever ruff version CI
# happens to install. ruff 0.16.0 (2026-07-23) widened its default rule set;
# CI installs ruff unpinned, so every run from that date on failed with 75
# findings in code that had not changed. Most of the newly-default rules
# contradict this engine's trust contract on purpose — BLE001 (blind except),
# PLW1510 (subprocess without check) and S112 are how "fail-open everywhere"
# is implemented, and DTZ* would force tz-aware stamps into a ledger whose
# history is naive-local. Declaring `select` makes the gate reproducible across
# ruff versions; widening it becomes a deliberate commit, never a silent
# upgrade that turns CI red overnight.
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # ruff's historical default set — the contract this repo was written against
